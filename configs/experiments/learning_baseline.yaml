# Learning baseline: full LLM pipeline with cybernetic weight adaptation
config_id: learning_baseline
description: "LLM player with balanced policy, narrative on, engine-assisted candidates, learning enabled"

player_type: llm
policy: balanced
candidate_mode: engine_assisted
narrative_mode: "on"
prompt_version: v1.1
lab_color: white

opponent:
  type: stockfish
  engine_path: /opt/homebrew/bin/stockfish
  skill_level: 3
  depth: 8
  time_limit: 0.1

engine:
  path: /opt/homebrew/bin/stockfish
  skill_level: 5
  depth: 10
  time_limit: 0.1

game_count: 20
max_moves_per_game: 30
random_seed: 42
logging_level: INFO

# Learning parameters
learning_mode: true
gain: 0.05
good_threshold: 30.0
bad_threshold: 100.0
