# Baseline: full LLM pipeline, balanced policy, narrative on, engine-assisted candidates
config_id: baseline
description: "LLM player with balanced policy, narrative on, engine-assisted candidates vs Stockfish skill 3"

player_type: llm              # llm | llm_raw | stockfish | random
policy: balanced
candidate_mode: engine_assisted   # engine_assisted | heuristic_only
narrative_mode: "on"              # on | off
prompt_version: v1.1
lab_color: white

opponent:
  type: stockfish
  engine_path: /opt/homebrew/bin/stockfish
  skill_level: 3
  depth: 8
  time_limit: 0.1

engine:                        # engine used for candidate generation
  path: /opt/homebrew/bin/stockfish
  skill_level: 5
  depth: 10
  time_limit: 0.1

game_count: 20
max_moves_per_game: 30        # full chess moves (30 = 60 plies)
random_seed: 42
logging_level: INFO
