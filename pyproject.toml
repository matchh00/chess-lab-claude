[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "chess-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
